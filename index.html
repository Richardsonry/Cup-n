<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cupón</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{
  --bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#d2d2d7;--field:#fff;--blue:#0071e3;--blue-h:#0077ed;--shadow:rgba(0,0,0,.12);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--muted:#a1a1a6;--line:#424245;--field:#2c2c2e;--blue:#2997ff;--blue-h:#47a6ff;--shadow:rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--muted:#a1a1a6;--line:#424245;--field:#2c2c2e;--blue:#2997ff;--blue-h:#47a6ff;--shadow:rgba(0,0,0,.6)}
html{height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.page{width:100%;max-width:760px}
.wrap{filter:drop-shadow(0 14px 30px var(--shadow))}
.coupon{--r:14px;--split:230px;--h:300px;display:grid;grid-template-columns:1fr var(--split);background:var(--card);border-radius:28px;
  -webkit-mask:radial-gradient(circle var(--r) at calc(100% - var(--split)) 0,#0000 98%,#000),radial-gradient(circle var(--r) at calc(100% - var(--split)) 100%,#0000 98%,#000);
  -webkit-mask-composite:source-in;
  mask:radial-gradient(circle var(--r) at calc(100% - var(--split)) 0,#0000 98%,#000) intersect,radial-gradient(circle var(--r) at calc(100% - var(--split)) 100%,#0000 98%,#000);
  mask-composite:intersect}
.main{padding:40px 40px 36px}
.top{display:flex;align-items:center;gap:10px}
.ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:17px;background:linear-gradient(135deg,var(--a),var(--b))}
.ico:empty{display:none}
.kicker{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:-.01em}
h2{margin:14px 0 0;font-size:clamp(44px,10vw,68px);line-height:1;font-weight:700;letter-spacing:-.045em;padding-bottom:.06em;overflow-wrap:anywhere;
  background:linear-gradient(120deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.txt{margin:14px 0 0;color:var(--muted);font-size:17px;line-height:1.47;letter-spacing:-.022em;max-width:32ch}
.who{margin:18px 0 0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.stub{position:relative;padding:32px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.stub::before{content:"";position:absolute;left:0;top:26px;bottom:26px;border-left:2px dashed var(--line)}
.qr{width:150px;height:150px;padding:8px;background:#fff;border-radius:16px;box-shadow:0 0 0 1px var(--line)}
.qr svg{display:block;width:100%;height:100%}
.info{display:flex;flex-direction:column;gap:2px}
.lbl{font-size:12px;color:var(--muted);letter-spacing:-.01em}
.val{font-size:14px;font-weight:600;letter-spacing:-.01em;margin-bottom:8px}
.val:last-child{margin-bottom:0}
button{appearance:none;border:0;cursor:pointer;font:inherit;font-size:17px;letter-spacing:-.022em;color:#fff;background:var(--blue);padding:12px 22px;border-radius:980px;transition:background .2s,transform .15s}
button:hover{background:var(--blue-h)}
button:active{transform:scale(.97)}
button:focus-visible{outline:4px solid color-mix(in srgb,var(--blue) 45%,transparent);outline-offset:2px}
.actions{display:none;margin:28px auto 0;max-width:420px}
.actions button{width:100%}
.view .actions{display:block}
@media (max-width:640px){
  body{padding:20px 16px}
  .coupon{--split:0px;grid-template-columns:1fr;
    -webkit-mask:radial-gradient(circle var(--r) at 0 calc(100% - var(--h)),#0000 98%,#000),radial-gradient(circle var(--r) at 100% calc(100% - var(--h)),#0000 98%,#000);
    -webkit-mask-composite:source-in;
    mask:radial-gradient(circle var(--r) at 0 calc(100% - var(--h)),#0000 98%,#000) intersect,radial-gradient(circle var(--r) at 100% calc(100% - var(--h)),#0000 98%,#000);mask-composite:intersect}
  .main{padding:32px 28px 24px}
  .stub{height:var(--h);padding:24px 28px;gap:14px}
  .stub::before{left:26px;right:26px;top:0;bottom:auto;border-left:0;border-top:2px dashed var(--line)}
}
@media (prefers-reduced-motion:reduce){button{transition:none}}
@media print{
  @page{margin:12mm}
  :root:root:root{--bg:#fff;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#d2d2d7}
  body{padding:0;background:#fff;display:block}
  .wrap{filter:none}
  .actions{display:none!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="page" id="page">
  <div class="wrap" id="wrap">
    <article class="coupon" aria-label="Cupón">
      <section class="main">
        <div class="top"><span class="ico" id="vIcon" aria-hidden="true"></span><span class="kicker" id="vKicker"></span></div>
        <h2 id="vTitulo"></h2>
        <p class="txt" id="vTexto"></p>
        <p class="who" id="vWho"></p>
      </section>
      <aside class="stub">
        <div class="qr" id="vQr" aria-label="Código QR del cupón"></div>
        <div class="info">
          <div class="lbl">Válido hasta</div><div class="val" id="vValid"></div>
          <div class="lbl">Escaneado el</div><div class="val" id="vScan"></div>
        </div>
      </aside>
    </article>
  </div>
  <div class="actions"><button type="button" id="pdf">Guardar como PDF</button></div>
</div>

<script>
const $ = id => document.getElementById(id);
const COLORES = [["#0a84ff","#bf5af2"],["#ff375f","#ff9f0a"],["#bf5af2","#ff375f"],["#30b0c7","#0a84ff"],["#30d158","#30b0c7"],["#ff9f0a","#ffd60a"]];

function qrSvg(text){
  try{
    const q = qrcode(0, "M"); q.addData(text); q.make();
    const n = q.getModuleCount(); let d = "";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r,c)) d += `M${c} ${r}h1v1h-1z`;
    return `<svg viewBox="0 0 ${n} ${n}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><path d="${d}" fill="#000"/></svg>`;
  }catch(e){ return ""; }
}

/* Datos: #d=Nombre|Validez|Mensaje|Para|De|TextoPequeño|Icono|Color   (m=1 → vista previa, sin escaneo) */
const params = new URLSearchParams(location.hash.slice(1));
const raw = params.get("d");
const preview = params.get("m") === "1";
const base = location.href.split("#")[0];

let c;
if (raw){
  const p = raw.split("|").map(s => s.trim());
  const ci = parseInt(p[7], 10);
  c = {titulo:p[0], valid:p[1], texto:p[2], para:p[3], de:p[4], kicker:p[5] || "Cupón", icono:p[6] || "", color:COLORES[ci] ? ci : 0};
} else {
  c = {titulo:"Cena", valid:"Sin fecha de vencimiento", texto:"En un restaurante o en casa. Tú decides, yo invito.", para:"Mi amor", de:"Tu nombre", kicker:"Cupón para una", icono:"🍷", color:1};
}

const link = raw ? base + "#d=" + encodeURIComponent(raw) : base;
const scan = (raw && !preview) ? new Date() : null;
const FMT = {day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"};

$("vKicker").textContent = c.kicker;
$("vTitulo").textContent = c.titulo || "Cupón";
$("vTexto").textContent = c.texto || "";
const who = [c.para && "Para " + c.para, c.de && "de " + c.de].filter(Boolean).join(", ");
$("vWho").textContent = who; $("vWho").hidden = !who;
$("vIcon").textContent = c.icono;
$("wrap").style.setProperty("--a", COLORES[c.color][0]);
$("wrap").style.setProperty("--b", COLORES[c.color][1]);
$("vValid").textContent = c.valid || "—";
$("vScan").textContent = scan ? scan.toLocaleString("es", FMT) : "Se registra al escanear";
$("vQr").innerHTML = qrSvg(link);
document.title = "Cupón: " + (c.titulo || "");

if (scan){
  document.body.classList.add("view");
  $("pdf").onclick = () => window.print();
}
</script>
</body>
</html>
