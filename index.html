<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cupón</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--blue:#0071e3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{-webkit-font-smoothing:antialiased;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif}
.stage{--hintc:#6e6e73;position:relative;overflow:hidden;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:40px 24px}
.wrap{--p:0;width:fit-content;max-width:100%;filter:drop-shadow(0 18px 36px rgba(0,0,0,.22))}
.coupon{--r:12px;--split:250px;--h:270px;--pitch:12px;position:relative;display:flex}

/* piezas con muescas */
.main,.stub{background:var(--card);
  -webkit-mask:var(--cp),var(--sc),var(--n1),var(--n2);mask:var(--cp),var(--sc),var(--n1),var(--n2);
  -webkit-mask-composite:source-over,source-in,source-in,source-in;mask-composite:add,intersect,intersect,intersect}
.main{--n1:radial-gradient(circle var(--r) at 100% 0,#0000 98%,#000);--n2:radial-gradient(circle var(--r) at 100% 100%,#0000 98%,#000);
  --cp:linear-gradient(#0000 calc(12px + var(--p)*(100% - 24px)),#000 0);
  --sc:radial-gradient(circle 3px at 100% 50%,#0000 98%,#000) 0 12px/100% var(--pitch) repeat-y;
  width:520px;flex:0 1 auto;min-width:0;padding:40px 44px 36px;border-radius:28px 0 0 28px}
.stub{--n1:radial-gradient(circle var(--r) at 0 0,#0000 98%,#000);--n2:radial-gradient(circle var(--r) at 0 100%,#0000 98%,#000);
  --cp:linear-gradient(#0000 calc(12px + var(--p)*(100% - 24px)),#000 0);
  --sc:radial-gradient(circle 3px at 0 50%,#0000 98%,#000) 0 12px/100% var(--pitch) repeat-y;
  width:var(--split);flex:0 0 auto;padding:28px 22px;border-radius:0 28px 28px 0;transform-origin:0 100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;
  transition:width .7s cubic-bezier(.2,.8,.2,1),padding .7s cubic-bezier(.2,.8,.2,1)}
.stub.gone{width:0;padding-left:0;padding-right:0;overflow:hidden}

.kicker{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:var(--muted);letter-spacing:-.01em}
.kicker i{width:11px;height:11px;flex:none;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b))}
h2{margin:10px 0 0;font-size:clamp(44px,9vw,64px);line-height:1.12;font-weight:700;letter-spacing:-.04em;padding-bottom:.18em;margin-bottom:-.06em;overflow-wrap:anywhere;
  background:linear-gradient(120deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.txt{margin:10px 0 0;color:var(--muted);font-size:17px;line-height:1.45;letter-spacing:-.022em;max-width:34ch}
.who{margin:16px 0 0;font-size:16px;font-weight:600;letter-spacing:-.01em;color:var(--text)}
.terms{margin:10px -22px 0 0;font-size:12.5px;line-height:1.45;color:var(--muted);white-space:pre-line}
.qrwrap{--qrs:130px;width:calc(var(--qrs) + 20px);height:calc(var(--qrs) + 20px);padding:10px;border-radius:16px;background:#fff;display:grid;place-items:center}
#qr img,#qr canvas{display:block;width:var(--qrs);height:var(--qrs)}
.dl{font-size:13px;color:var(--muted);letter-spacing:-.01em}
.dv{margin-top:2px;font-size:18px;font-weight:600;letter-spacing:-.02em;color:var(--text)}
.dh{margin-top:1px;font-size:15px;color:var(--muted)}

/* línea de corte */
.seam{position:absolute;top:0;bottom:0;right:calc(var(--split) - 22px);width:44px;z-index:3;touch-action:none;cursor:grab;border-radius:12px}
.seam:active{cursor:grabbing}
.seam.off{display:none}
.seam::before{content:"";position:absolute;left:0;right:0;top:12px;bottom:12px;
  background:radial-gradient(circle 1.7px at 50% 50%,var(--dot) 98%,#0000) 0 0/100% var(--pitch) repeat-y;
  -webkit-mask-image:linear-gradient(#0000 calc(var(--p)*100%),#000 0);mask-image:linear-gradient(#0000 calc(var(--p)*100%),#000 0)}
.scissors{position:absolute;left:50%;top:calc(12px + var(--p)*(100% - 24px));width:38px;height:38px;padding:8px;border-radius:50%;
  background:var(--card);color:var(--text);box-shadow:0 4px 14px rgba(0,0,0,.25);pointer-events:none;transform:translate(-50%,-50%) rotate(90deg)}
.hint .scissors{animation:nudgeY 1.9s ease-in-out infinite}
@keyframes nudgeY{0%,100%{transform:translate(-50%,-50%) rotate(90deg)}55%{transform:translate(-50%,calc(-50% + 90px)) rotate(90deg)}}
@keyframes nudgeX{0%,100%{transform:translate(-50%,-50%)}55%{transform:translate(calc(-50% + 90px),-50%)}}
.note{margin:0;text-align:center;font-size:15px;color:var(--hintc);max-width:34ch}
.save{appearance:none;border:0;cursor:pointer;font:inherit;font-size:17px;letter-spacing:-.022em;color:#fff;background:var(--blue);padding:12px 30px;border-radius:980px;
  animation:pop .5s cubic-bezier(.3,1.4,.5,1) both;transition:transform .15s}
.save:active{transform:scale(.97)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.9)}to{opacity:1;transform:none}}

@media (max-width:640px){
  .stage{padding:32px 16px}
  .wrap{width:100%;max-width:440px}
  .coupon{flex-direction:column}
  .main,.stub{--n1:radial-gradient(circle var(--r) at 0 100%,#0000 98%,#000);--n2:radial-gradient(circle var(--r) at 100% 100%,#0000 98%,#000);
    --cp:linear-gradient(to right,#0000 calc(12px + var(--p)*(100% - 24px)),#000 0);
    --sc:radial-gradient(circle 3px at 50% 100%,#0000 98%,#000) 12px 0/var(--pitch) 100% repeat-x}
  .main{width:auto;padding:32px 26px 28px;border-radius:28px 28px 0 0}
  .stub{--n1:radial-gradient(circle var(--r) at 0 0,#0000 98%,#000);--n2:radial-gradient(circle var(--r) at 100% 0,#0000 98%,#000);
    --sc:radial-gradient(circle 3px at 50% 0,#0000 98%,#000) 12px 0/var(--pitch) 100% repeat-x;
    width:auto;height:var(--h);padding:20px;gap:12px;border-radius:0 0 28px 28px;transform-origin:100% 0;transition:height .7s cubic-bezier(.2,.8,.2,1)}
  .stub.gone{width:auto;height:0;padding:0}
  .qrwrap{--qrs:112px}
  .seam{top:auto;left:0;right:0;width:auto;height:44px;bottom:calc(var(--h) - 22px)}
  .seam::before{top:0;bottom:0;left:12px;right:12px;background:radial-gradient(circle 1.7px at 50% 50%,var(--dot) 98%,#0000) 0 0/var(--pitch) 100% repeat-x;
    -webkit-mask-image:linear-gradient(to right,#0000 calc(var(--p)*100%),#000 0);mask-image:linear-gradient(to right,#0000 calc(var(--p)*100%),#000 0)}
  .scissors{top:50%;left:calc(12px + var(--p)*(100% - 24px));transform:translate(-50%,-50%)}
  .hint .scissors{animation-name:nudgeX}
}
@media (prefers-reduced-motion:reduce){.hint .scissors,.save{animation:none}.stub{transition:none}}
</style>
</head>
<body>
<main class="stage" id="stage">
  <div class="wrap" id="wrap">
    <article class="coupon" id="coupon" aria-label="Cupón">
      <section class="main" id="main">
        <div class="kicker"><i></i><span id="kicker"></span></div>
        <h2 id="titulo"></h2>
        <p class="txt" id="texto"></p>
        <p class="who" id="who"></p>
        <p class="terms" id="terms"></p>
      </section>
      <aside class="stub" id="stub">
        <div class="qrwrap"><div id="qr"></div></div>
        <div><div class="dl" id="dl"></div><div class="dv" id="dv"></div><div class="dh" id="dh"></div></div>
      </aside>
      <div class="seam hint" id="seam" role="slider" tabindex="0" aria-label="Cortar el cupón por la línea de muescas" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <svg class="scissors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="5.5" cy="6.5" r="2.6"/><circle cx="5.5" cy="17.5" r="2.6"/><path d="M7.7 8 21 16M7.7 16 21 8"/></svg>
      </div>
    </article>
  </div>
  <p class="note" id="note">Desliza sobre la línea de puntos para cortar el cupón.</p>
  <button class="save" id="save" type="button" hidden>Guardar</button>
</main>

<script>
/* Contenido del cupón (mismos valores que en el cupón 1) */
const S = {
  card:"#ffffff",                 // color del cupón
  grad:["#ff375f","#ff9f0a"],     // degradado del título y del círculo
  bg:"light",                     // "light" | "dark" | "none"
  kicker:"Cupón para una", titulo:"Cena",
  texto:"En un restaurante o en casa. Tú decides, yo invito.",
  para:"Mi amor",
  terms:"Este cupón es personal e intransferible. Avisa con al menos 48 horas de anticipación. Sujeto a disponibilidad y no canjeable por dinero. Válido para un solo uso.",
  mode:"vence",                   // "vence" = Fecha de vencimiento | "valido" = Válido
  fecha:"2026-12-31", hora:"19:00"
};
const QR_URL = "https://richardsonry.github.io/Cup-n/";

const $=id=>document.getElementById(id);
const stage=$("stage"), wrap=$("wrap"), coupon=$("coupon"), stub=$("stub"), seam=$("seam"), note=$("note"), save=$("save");
const BGS={light:"#f5f5f7",dark:"#000000",none:"transparent"};
const dark=hex=>{const n=parseInt(hex.slice(1),16);return (.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))/255<=.6};
const fmt=f=>{if(!f)return "";const [y,m,d]=f.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("es",{day:"numeric",month:"long",year:"numeric"})};
const fmtH=h=>{if(!h)return "";const [a,b]=h.split(":").map(Number);return new Date(2000,0,1,a,b).toLocaleTimeString("es",{hour:"numeric",minute:"2-digit"})};
const mq=matchMedia("(max-width:640px)"), reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;

/* ---------- pintar ---------- */
(function(){
  const d=dark(S.card), w=wrap.style;
  w.setProperty("--card",S.card); w.setProperty("--text",d?"#ffffff":"#1d1d1f");
  w.setProperty("--muted",d?"rgba(255,255,255,.66)":"rgba(29,29,31,.62)");
  w.setProperty("--dot",d?"rgba(255,255,255,.5)":"rgba(29,29,31,.4)");
  w.setProperty("--a",S.grad[0]); w.setProperty("--b",S.grad[1]);
  const bg=BGS[S.bg]; document.documentElement.style.background=bg; document.body.style.background=bg;
  stage.style.setProperty("--hintc",S.bg==="dark"?"#a1a1a6":"#6e6e73");
  $("kicker").textContent=S.kicker; $("titulo").textContent=S.titulo; $("texto").textContent=S.texto;
  $("who").textContent=S.para?"Para "+S.para:""; $("who").hidden=!S.para;
  $("terms").textContent=S.terms; $("terms").hidden=!S.terms;
  $("dl").textContent=S.mode==="valido"?"Válido":"Fecha de vencimiento";
  $("dv").textContent=fmt(S.fecha)||"Sin fecha"; $("dh").textContent=fmtH(S.hora); $("dh").hidden=!S.hora;
  try{ new QRCode($("qr"),{text:QR_URL,width:300,height:300,colorDark:"#000000",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M}); }catch(e){}
})();
let measured=false;
function measure(){
  if(done) return;
  const L=mq.matches?coupon.offsetWidth:coupon.offsetHeight, n=Math.max(1,Math.floor((L-24)/12));
  coupon.style.setProperty("--pitch",((L-24)/n)+"px");
}
new ResizeObserver(measure).observe(coupon);

/* ---------- corte ---------- */
let p=0,drag=false,done=false,tick=0;
function setP(v){
  p=Math.max(0,Math.min(1,v)); wrap.style.setProperty("--p",p);
  stub.style.transformOrigin=mq.matches?"100% 0":"0 100%";
  stub.style.transform=mq.matches?`rotate(${-p*7}deg) translateY(${p*5}px)`:`rotate(${p*7}deg) translateX(${p*5}px)`;
  seam.setAttribute("aria-valuenow",Math.round(p*100));
}
const pos=e=>{const r=seam.getBoundingClientRect();
  return mq.matches?(e.clientX-r.left-12)/(r.width-24):(e.clientY-r.top-12)/(r.height-24)};
const buzz=v=>{try{navigator.vibrate&&navigator.vibrate(v)}catch(_){}};
const hint=()=>{seam.classList.remove("hint");void seam.offsetWidth;seam.classList.add("hint")};
function finish(){
  if(done) return; done=true; drag=false; setP(1); seam.classList.add("off"); buzz([20,40,20]);
  note.textContent="Cortado. Ahora puedes guardar tu cupón."; save.hidden=false;
  if(reduce){stub.style.opacity=0;stub.classList.add("gone");return}
  const from=stub.style.transform;
  const mid=mq.matches?"translate(-12px,90px) rotate(-14deg)":"translate(30px,90px) rotate(14deg)";
  const to=mq.matches?"translate(-40px,520px) rotate(-34deg)":"translate(110px,520px) rotate(36deg)";
  stub.animate([{transform:from,opacity:1},{transform:mid,opacity:1,offset:.3},{transform:to,opacity:0}],
    {duration:1100,easing:"cubic-bezier(.4,0,.9,.7)",fill:"forwards"}).onfinish=()=>stub.classList.add("gone");
}
seam.addEventListener("pointerdown",e=>{
  if(done) return; const q=pos(e);
  if(q>p+.3||q<p-.3){hint();return}
  drag=true; seam.setPointerCapture(e.pointerId); seam.classList.remove("hint"); e.preventDefault();
});
seam.addEventListener("pointermove",e=>{
  if(!drag) return; const np=Math.min(pos(e),p+.12), t=Math.floor(np*20);
  if(t!==tick){tick=t;buzz(6)} setP(np); if(p>=.94) finish();
});
const end=()=>{if(!drag) return; drag=false; if(p>=.85) finish()};
seam.addEventListener("pointerup",end); seam.addEventListener("pointercancel",end);
seam.addEventListener("keydown",e=>{
  if(done||!["ArrowDown","ArrowRight","Enter"," "].includes(e.key)) return;
  e.preventDefault(); seam.classList.remove("hint"); setP(p+.15); if(p>=.94) finish();
});

/* ---------- guardar PNG sin fondo ---------- */
function drawCoupon(){
  const W=770,mw=520,sw=W-mw,pad=44,m=4,sc=3,F='-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif';
  const cv=document.createElement("canvas"),x=cv.getContext("2d");
  const wrapT=(t,font,w)=>{x.font=font;const out=[];(t||"").split("\n").forEach(par=>{let l="";par.split(" ").forEach(wd=>{
    const n=l?l+" "+wd:wd; if(x.measureText(n).width>w&&l){out.push(l);l=wd}else l=n});out.push(l)});return out};
  const f2=`700 66px ${F}`,f3=`400 17px ${F}`,f5=`400 12.5px ${F}`,tw=mw-pad*2;
  const tl=wrapT(S.titulo||" ",f2,tw),xl=wrapT(S.texto,f3,380),ml=S.terms?wrapT(S.terms,f5,mw-pad-22):[];
  let y=pad; const ky=y+8; y+=34; const ty=y; y=ty+tl.length*80; const xy=y; y+=xl.length*25+14;
  const py=y; if(S.para) y+=26; const my=y+6; y+=ml.length*18;
  const H=Math.max(Math.ceil(y+pad-6),330);
  cv.width=W*sc; cv.height=H*sc; x.scale(sc,sc);
  const c=S.card,g=S.grad,d=dark(c),txt=d?"#fff":"#1d1d1f",mut=d?"rgba(255,255,255,.66)":"rgba(29,29,31,.62)";
  x.fillStyle=c; x.beginPath(); x.roundRect(0,0,W,H,28); x.fill();
  const kg=x.createLinearGradient(pad,ky-6,pad+11,ky+6); kg.addColorStop(0,g[0]); kg.addColorStop(1,g[1]);
  x.fillStyle=kg; x.beginPath(); x.arc(pad+5.5,ky,5.5,0,7); x.fill();
  x.font=`600 15px ${F}`; x.fillStyle=mut; x.fillText(S.kicker,pad+21,ky+5);
  x.font=f2; const gw=Math.min(tw,Math.max(200,...tl.map(l=>x.measureText(l).width)));
  const tg=x.createLinearGradient(pad,0,pad+gw,0); tg.addColorStop(0,g[0]); tg.addColorStop(1,g[1]);
  x.fillStyle=tg; tl.forEach((l,i)=>x.fillText(l,pad,ty+58+i*80));
  x.font=f3; x.fillStyle=mut; xl.forEach((l,i)=>x.fillText(l,pad,xy+17+i*25));
  if(S.para){x.font=`600 16px ${F}`;x.fillStyle=txt;x.fillText("Para "+S.para,pad,py+14)}
  x.font=f5; x.fillStyle=mut; ml.forEach((l,i)=>x.fillText(l,pad,my+12+i*18));
  const cx=mw+sw/2, qc=document.querySelector("#qr canvas"), hh=fmtH(S.hora);
  const th=150+20+13+27+(hh?22:0), by=(H-th)/2;
  if(qc){ x.fillStyle="#fff"; x.beginPath(); x.roundRect(cx-75,by,150,150,16); x.fill(); x.drawImage(qc,cx-65,by+10,130,130); }
  const dy=by+150+20+13; x.textAlign="center";
  x.font=`400 13px ${F}`; x.fillStyle=mut; x.fillText(S.mode==="valido"?"Válido":"Fecha de vencimiento",cx,dy);
  x.font=`600 18px ${F}`; x.fillStyle=txt; x.fillText(fmt(S.fecha)||"Sin fecha",cx,dy+25);
  if(hh){x.font=`400 15px ${F}`;x.fillStyle=mut;x.fillText(hh,cx,dy+47)} x.textAlign="left";
  x.globalCompositeOperation="destination-out"; x.fillStyle="#000";
  const n=Math.max(1,Math.floor((H-24)/12)),pt=(H-24)/n;
  [0,H].forEach(yy=>{x.beginPath();x.arc(mw,yy,12,0,7);x.fill()});
  for(let k=0;k<n;k++){x.beginPath();x.arc(mw,12+pt/2+k*pt,3,0,7);x.fill()}
  const out=document.createElement("canvas"); out.width=(W+m*2)*sc; out.height=(H+m*2)*sc;
  out.getContext("2d").drawImage(cv,m*sc,m*sc);
  return out;
}
save.onclick=()=>{
  save.disabled=true;
  drawCoupon().toBlob(b=>{
    const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="cupon.png";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    save.disabled=false;
  },"image/png");
};

setP(0);
</script>
</body>
</html>
